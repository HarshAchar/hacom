<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harsh Achar</title>
  <meta name="description" content="Personal website of Harsh Achar">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #D8CBB8;
      color: #161616;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: flex-end;
      gap: 28px;
      padding: 28px 40px;
    }

    nav button {
      background: none;
      border: 0;
      padding: 0;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #161616;
    }

    nav button.active {
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    main {
      width: min(760px, calc(100% - 48px));
      margin: 120px auto 0;
    }

    h1 {
      font-size: clamp(42px, 8vw, 72px);
      margin: 0 0 20px;
      letter-spacing: -0.04em;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
      margin: 0 0 18px;
    }

    a {
      color: #161616;
      text-decoration: none;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>

<body>
  <nav>
    <button id="homeTab" class="active" onclick="showPage('home')">Home</button>
    <button id="contactTab" onclick="showPage('contact')">Contact</button>
  </nav>

  <main>
    <section id="home" class="page active">
      <h1>Harsh Achar</h1>
      <p>ASP.NET Developer</p>
    </section>

    <section id="contact" class="page">
      <h1>Get in touch!</h1>
      <p>
        <strong>
          <a
            href="mailto:contact@harshachar.com"
            onclick="track('email')"
          >
            contact@harshachar.com
          </a>
        </strong>
      </p>
    </section>
  </main>

  <script>
    function track(event) {
      navigator.sendBeacon(
        `/track?event=${encodeURIComponent(event)}`
      );
    }

    function showPage(pageName) {
      if (pageName === 'contact') {
        track('contact');
      }

      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      document.querySelectorAll('nav button').forEach(button => {
        button.classList.remove('active');
      });

      document.getElementById(pageName).classList.add('active');
      document.getElementById(pageName + 'Tab').classList.add('active');
    }
  </script>
</body>
</html>
